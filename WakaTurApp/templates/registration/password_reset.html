{% extends "WakaTurApp/base1.html" %}

{% load static %}

{% block title %}	Recuperar Contraseña	{% endblock %}

{% block content %}
<br><br><br><br>
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center">Recuperar Contraseña</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning w-100">Enviar enlace de recuperación</button>
        </form>
        <p class="text-center mt-3">
            <a href="{% url 'login' %}">Volver al Login</a>
        </p>
    </div>
</div>
{% endblock %}
