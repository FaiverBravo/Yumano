
{% extends "WakaTurApp/base1.html" %}

{% load static %}

{% block title %}	WakaTur │ Registro	{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg rounded-3 border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="bg-warning rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px;">
                            <i class="fas fa-user-plus fa-2x text-white"></i>
                        </div>
                        <h3>Crear una cuenta</h3>
                        <p class="text-muted">Completa el formulario para registrarte</p>
                    </div>
                    
                    <form method="post" action="{% url 'registro' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-user"></i></span>
                                <input type="text" id="username" name="username" placeholder="Nombre de usuario" required class="form-control" autofocus style="color: black;">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-id-card"></i></span>
                                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required class="form-control" style="color: black;">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellidos</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-id-card"></i></span>
                                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required class="form-control" style="color: black;">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-envelope"></i></span>
                                <input type="email" id="email" name="email" placeholder="tu@correo.com" required class="form-control" style="color: black;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tipo_usuario" class="form-label">Tipo de Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-id-card"></i></span>
                                <select id="tipo_usuario" name="tipo_usuario" class="form-control" required style="color: black;">
                                    <option value="">Selecciona un tipo</option>
                                    <option value="turista">Turista</option>
                                    <option value="cliente_local">Cliente</option>
                                    <option value="anfitrion">Anfitrión de Alojamientos</option>
                                    <option value="proveedor_experiencias">Proveedor de Experiencias</option>
                                    <option value="restaurantero">Restaurantero/Gastronómico</option>
                                    <option value="proveedor_servicios">Proveedor de Servicios</option>
                                    <option value="vendedor">Vendedor en Tienda</option>
                                    <option value="admin">Administrador</option>
                                    <option value="soporte">Soporte/Atención al Cliente</option>
                                    <option value="gestor_contenidos">Gestor de Contenidos</option>
                                </select>
                            </div>
                            
                        </div>
                        
                        <div class="mb-3">
                            <label for="password1" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-lock"></i></span>
                                <input type="password" id="password1" name="password1" placeholder="Contraseña" required class="form-control" style="color: black;">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirmar Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-lock"></i></span>
                                <input type="password" id="password2" name="password2" placeholder="Repite la contraseña" required class="form-control" style="color: black;">

                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" id="terms" name="terms" class="form-check-input" required>
                                <label for="terms" class="form-check-label">Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a></label>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning py-2">
                                <i class="fas fa-user-plus me-2"></i>Registrarse
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia sesión aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
