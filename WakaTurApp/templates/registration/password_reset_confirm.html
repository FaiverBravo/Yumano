{% extends "WakaTurApp/base1.html" %}

{% load static %}

{% block title %}	Correo Enviado	{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center">Restablecer Contraseña</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Actualizar Contraseña</button>
        </form>
    </div>
</div>
{% endblock %}
