{% extends "YumanoApp/base_modern.html" %}
{% load static %}

{% block title %}Contraseña Actualizada | YÚMANO{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card bg-white p-5 text-center animate-fadeInUp">
                <div class="bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
                    <i class="fas fa-check fa-2x"></i>
                </div>
                <h2 class="fw-bold mb-3">¡Todo listo!</h2>
                <p class="text-secondary mb-4">
                    Tu contraseña ha sido actualizada correctamente. 
                    Ya puedes iniciar sesión con tu nueva clave.
                </p>
                <div class="d-grid">
                    <a href="{% url 'login' %}" class="btn btn-premium py-3">
                        Iniciar Sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
